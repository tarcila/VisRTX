<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#1e1f24"/>
  <text x="24" y="34" fill="#e6e6e6" font-size="20" font-weight="600">Proposal 1 — Viewport chips on the display node</text>
  <text x="24" y="56" fill="#9aa0aa" font-size="13">Per-display masking lives ON the node in the graph canvas. Viewport reveal via a tab strip "+".</text>

  <!-- Viewport tab strip (reveal control) -->
  <text x="520" y="92" fill="#9aa0aa" font-size="12">central viewport area</text>
  <g>
    <rect x="520" y="100" width="120" height="30" rx="4" fill="#2d8cff"/>
    <text x="536" y="120" fill="#ffffff" font-size="13" font-weight="600">Viewport 1</text>
    <rect x="644" y="100" width="120" height="30" rx="4" fill="#3a3d46"/>
    <text x="660" y="120" fill="#c9ced8" font-size="13">Viewport 2</text>
    <rect x="768" y="100" width="34" height="30" rx="4" fill="#2a2c33" stroke="#4a4d57"/>
    <text x="779" y="121" fill="#7fd17f" font-size="18" font-weight="700">+</text>
  </g>
  <rect x="520" y="130" width="412" height="300" rx="4" fill="#15161a" stroke="#3a3d46"/>
  <circle cx="690" cy="270" r="58" fill="#7a5cff" opacity="0.55"/>
  <rect x="640" y="220" width="100" height="100" fill="none" stroke="#5fd35f" stroke-width="2"/>
  <text x="536" y="420" fill="#6b7280" font-size="11">"+" reveals/creates the next viewport tab on demand</text>

  <!-- Graph canvas with display nodes -->
  <text x="24" y="92" fill="#9aa0aa" font-size="12">graph editor canvas</text>

  <!-- DisplayVolume node -->
  <g>
    <rect x="24" y="104" width="300" height="150" rx="6" fill="#23252c" stroke="#4a4d57"/>
    <rect x="24" y="104" width="300" height="26" rx="6" fill="#3a2f5c"/>
    <text x="36" y="122" fill="#e6e6e6" font-size="13" font-weight="600">DisplayVolume</text>
    <circle cx="24" cy="150" r="5" fill="#8ab4ff"/><text x="36" y="154" fill="#c9ced8" font-size="12">field</text>
    <circle cx="24" cy="172" r="5" fill="#8ab4ff"/><text x="36" y="176" fill="#c9ced8" font-size="12">tf</text>
    <!-- chip row -->
    <text x="36" y="206" fill="#9aa0aa" font-size="11">viewports</text>
    <g font-size="11" font-weight="600" text-anchor="middle">
      <rect x="36" y="214" width="26" height="24" rx="4" fill="#2d8cff"/><text x="49" y="230" fill="#fff">1</text>
      <rect x="66" y="214" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="79" y="230" fill="#7b8089">2</text>
      <rect x="96" y="214" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="109" y="230" fill="#7b8089">3</text>
      <rect x="126" y="214" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="139" y="230" fill="#7b8089">4</text>
      <rect x="156" y="214" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="169" y="230" fill="#7b8089">5</text>
      <rect x="186" y="214" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="199" y="230" fill="#7b8089">6</text>
      <rect x="216" y="214" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="229" y="230" fill="#7b8089">7</text>
      <rect x="246" y="214" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="259" y="230" fill="#7b8089">8</text>
    </g>
  </g>

  <!-- DisplaySurface node -->
  <g>
    <rect x="24" y="290" width="300" height="150" rx="6" fill="#23252c" stroke="#4a4d57"/>
    <rect x="24" y="290" width="300" height="26" rx="6" fill="#3a2f5c"/>
    <text x="36" y="308" fill="#e6e6e6" font-size="13" font-weight="600">DisplaySurface</text>
    <circle cx="24" cy="336" r="5" fill="#8ab4ff"/><text x="36" y="340" fill="#c9ced8" font-size="12">in</text>
    <text x="36" y="392" fill="#9aa0aa" font-size="11">viewports</text>
    <g font-size="11" font-weight="600" text-anchor="middle">
      <rect x="36" y="400" width="26" height="24" rx="4" fill="#2d8cff"/><text x="49" y="416" fill="#fff">1</text>
      <rect x="66" y="400" width="26" height="24" rx="4" fill="#2d8cff"/><text x="79" y="416" fill="#fff">2</text>
      <rect x="96" y="400" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="109" y="416" fill="#7b8089">3</text>
      <rect x="126" y="400" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="139" y="416" fill="#7b8089">4</text>
      <rect x="156" y="400" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="169" y="416" fill="#7b8089">5</text>
      <rect x="186" y="400" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="199" y="416" fill="#7b8089">6</text>
      <rect x="216" y="400" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="229" y="416" fill="#7b8089">7</text>
      <rect x="246" y="400" width="26" height="24" rx="4" fill="#2a2c33" stroke="#4a4d57"/><text x="259" y="416" fill="#7b8089">8</text>
    </g>
  </g>

  <text x="24" y="478" fill="#c9ced8" font-size="13" font-weight="600">How it reads</text>
  <text x="24" y="500" fill="#9aa0aa" font-size="12">• Filled chip = this display renders in that viewport. Click a chip to toggle (writes viewportMask).</text>
  <text x="24" y="520" fill="#9aa0aa" font-size="12">• See every display's routing at a glance, no selection needed. Surface is in viewports 1 &amp; 2.</text>
  <text x="24" y="540" fill="#9aa0aa" font-size="12">• Viewport windows themselves are revealed by the "+" tab; chips only light up for existing viewports.</text>
</svg>
